# Lesson Lab staging stack. See docs/development.md, "Staging stack".
# Only Caddy (lessonlab-proxy) publishes ports: 80 and 443. It reaches the two web
# services over the lessonlab-edge network.

name: lessonlab-staging

x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-backend: &backend
  <<: *hardening
  image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
  user: "10001:10001"
  env_file: [.env]
  environment:
    DATABASE_URL: postgres://lessonlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@lessonlab-db:5432/lessonlab
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@lessonlab-redis:6379/0
  depends_on:
    lessonlab-db:
      condition: service_healthy
    lessonlab-redis:
      condition: service_healthy

services:
  # HTTPS in front of everything. Root inside the container only so it can bind
  # ports 80 and 443; every other capability is dropped.
  lessonlab-proxy:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS}
    ports:
      - "80:80"
      - "443:443"
    # The folder, not the file: git checkout replaces the file, and a container
    # holding a single-file mount would keep reading the old one.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

  lessonlab-db:
    <<: *hardening
    image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    user: "999:999"
    environment:
      POSTGRES_USER: lessonlab
      POSTGRES_DB: lessonlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonlab -d lessonlab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100

  lessonlab-redis:
    <<: *hardening
    image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 200mb --maxmemory-policy noeviction
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 50

  # One-off job, not a running service: docker compose run --rm lessonlab-migrate
  lessonlab-migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    networks: [data]
    healthcheck:
      disable: true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 50

  lessonlab-backend:
    <<: *backend
    networks: [edge, data]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  # Reads the "emails" queue, so it also needs the internet to reach the SMTP server.
  lessonlab-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "emails,celery", "--loglevel", "INFO", "--concurrency", "2"]
    networks: [egress, data]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100

  lessonlab-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]
    networks: [data]
    healthcheck:
      disable: true
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 50

  lessonlab-frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    user: "10001:10001"
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001
    networks: [edge]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100

networks:
  # Caddy and the two web services.
  edge:
    name: lessonlab-edge
  # No internet and no host access: only the database and Redis live here.
  data:
    internal: true
  egress: {}

volumes:
  db-data:
  # The TLS certificate and Caddy's account key. Losing it only means asking
  # Let's Encrypt again, but that has weekly limits.
  caddy-data:
  caddy-config:
