# Lesson Lab staging site, served by the shared nginx on the staging server.
# That nginx belongs to another project; it includes this file inside its http block
# and joins the lessonlab-edge network (see docs/development.md, "Staging stack").
#
# The upstreams are variables, so nginx looks the names up per request instead of at
# start-up. If this stack is down, our site returns 502 but nginx still starts and the
# other project keeps running.

server {
    listen 443 ssl;
    server_name staging.lessonlab.me;

    ssl_certificate     /etc/letsencrypt/live/staging.lessonlab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.lessonlab.me/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Staging must never show up in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;

    # Docker's internal DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lessonlab_backend  http://lessonlab-backend:8000;
    set $lessonlab_frontend http://lessonlab-frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location ^~ /api/ {
        proxy_pass $lessonlab_backend;
    }

    location ^~ /admin/ {
        proxy_pass $lessonlab_backend;
    }

    location ^~ /static/ {
        proxy_pass $lessonlab_backend;
    }

    location / {
        proxy_pass $lessonlab_frontend;
    }
}
