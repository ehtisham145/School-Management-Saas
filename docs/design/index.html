<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Lab Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a bright full-width school photo with the pitch in its calm side, then quiet white sections; E-Numerak's navy with the logo's orange. */
:root{
  color-scheme:light;
  --navy:#1e3a5f; --navy-hover:#172d4a; --navy-deep:#0f1d31; --navy-soft:#e1eaf3; --navy-line:#c3d4e6;
  --orange:#F5781E; --orange-hover:#FF8C3A; --orange-text:#B9500C; --orange-soft:#FEF0E5; --orange-on-dark:#FFB27A; --on-orange:#2A1400;
  --bg:#FFFFFF; --bg-tint:#f8fafc; --ink:#0f172a; --ink-soft:#475569; --line:#e2e8f0;
  --on-dark:#FFFFFF; --on-dark-soft:#c3d4e6; --on-dark-line:rgba(255,255,255,.16);
  --radius:16px; --shadow:0 18px 44px -24px rgba(15,29,49,.45);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --gutter:24px;
}
html[lang="ar"]{--font:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.wrap{width:min(1240px,100%);margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.3}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--navy);color:var(--on-dark)}
.btn-primary:hover{background:var(--navy-hover)}
.btn-orange{background:var(--orange);color:var(--on-orange)}
.btn-orange:hover{background:var(--orange-hover)}
.btn-outline{background:var(--bg);color:var(--navy);border-color:var(--navy-line)}
.btn-outline:hover{border-color:var(--navy);background:var(--navy-soft)}
.btn-sm{min-height:42px;padding:0 16px;font-size:14px;border-radius:10px}

/* Header */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
.brand{display:block;flex:none}
.brand img{height:50px;width:auto}
.nav{display:flex;gap:28px;font-size:14.5px;font-weight:600;color:var(--ink-soft)}
.nav a{padding-block:6px;border-bottom:2px solid transparent;transition:color .15s}
.nav a:hover{color:var(--navy)}
.nav a.on{color:var(--navy);border-color:var(--orange)}
.header-actions{display:flex;align-items:center;gap:8px}
.nav-signin{display:none}
.signin{font-size:14.5px;font-weight:600;padding:9px 12px;border-radius:10px;color:var(--navy)}
.signin:hover{background:var(--navy-soft)}

.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.lang-btn:hover{background:var(--bg-tint)}
.lang-btn svg{width:17px;height:17px}
.lang-btn .chev{width:13px;height:13px;transition:transform .15s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:172px;padding:6px;margin:0;list-style:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:none;border:0;border-radius:8px;font:inherit;font-size:14.5px;font-weight:500;color:inherit;cursor:pointer;text-align:start}
.lang-menu button:hover{background:var(--navy-soft)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--navy)}
.lang-menu .tick{visibility:hidden;color:var(--orange-text)}
.lang-menu button[aria-checked="true"] .tick{visibility:visible}
.menu-toggle{display:none;width:42px;height:42px;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}

/* Hero: the photo's people sit opposite the text, so Arabic mirrors the photo. */
.hero{position:relative;overflow:hidden;background:var(--bg)}
.hero-media{position:absolute;inset:0}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
html[dir="rtl"] .hero-media img{transform:scaleX(-1)}
.hero-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.94) 30%,rgba(255,255,255,0) 54%)}
html[dir="rtl"] .hero-media::after{background:linear-gradient(to left,#fff 0%,rgba(255,255,255,.94) 30%,rgba(255,255,255,0) 54%)}
.hero-in{position:relative;z-index:1;padding-block:clamp(56px,7vw,96px)}
.hero-copy{max-width:min(47%,540px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:var(--orange-soft);color:var(--orange-text);font-size:13px;font-weight:700}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--orange)}
.hero h1{margin-top:20px;font-size:clamp(36px,4.5vw,58px);font-weight:700;color:var(--navy-deep)}
.hero h1 em{font-style:normal;color:var(--orange-text)}
.lede{margin-top:18px;font-size:clamp(16px,1.35vw,18px);color:var(--ink-soft)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{display:flex;flex-wrap:wrap;gap:10px 24px;margin:30px 0 0;padding:0;list-style:none;font-size:14px;font-weight:500;color:var(--ink)}
.facts li{display:inline-flex;align-items:center;gap:8px}
.facts svg{width:18px;height:18px;color:var(--orange-text);flex:none}
.chip-card{position:absolute;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);color:var(--ink);border-radius:14px;box-shadow:0 18px 36px -14px rgba(15,29,49,.55);font-size:13px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -8px}}
.chip-card b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.chip-card span.sub{display:block;color:var(--ink-soft);font-size:12px;white-space:nowrap}
.chip-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex:none}
.chip-ico svg{width:18px;height:18px}
.chip-1{top:9%;inset-inline-start:50%}
.chip-2{bottom:9%;inset-inline-start:37%;animation-delay:-3s}

/* Trust strip */
.strip{background:var(--navy-deep);color:var(--on-dark)}
.strip-in{display:grid;grid-template-columns:repeat(4,1fr)}
.strip-item{padding:24px 22px;border-inline-start:1px solid var(--on-dark-line)}
.strip-item:first-child{border-inline-start:0;padding-inline-start:0}
.strip-item b{display:block;font-size:17px;font-weight:700}
.strip-item span{font-size:13.5px;color:var(--on-dark-soft)}

/* Sections */
.section{padding-block:clamp(64px,8vw,104px)}
.sec-head{max-width:640px;margin-bottom:44px}
.kicker{font-size:13.5px;font-weight:700;color:var(--orange-text);margin-bottom:10px}
.sec-head h2{font-size:clamp(28px,3.4vw,42px);font-weight:700;color:var(--navy-deep)}
.sec-head p:not(.kicker){margin-top:12px;color:var(--ink-soft);font-size:16.5px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{padding:26px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--navy-line)}
.card h3{margin-top:16px;font-size:18.5px;font-weight:700}
.card p{margin-top:8px;font-size:14.8px;color:var(--ink-soft)}
.ico{display:grid;place-items:center;width:46px;height:46px;border-radius:13px}
.ico svg{width:23px;height:23px}
.t-navy{background:var(--navy-soft);color:var(--navy)}
.t-orange{background:var(--orange-soft);color:var(--orange-text)}

/* Roles */
.roles{background:var(--bg-tint)}
.roles-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.role{padding:22px 18px;background:var(--bg);border-radius:14px;border:1px solid var(--line)}
.role h3{font-size:16px;font-weight:700;margin-top:12px}
.role p{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
.role .ico{width:40px;height:40px;border-radius:11px}
.role .ico svg{width:20px;height:20px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s;margin:0;padding:0;list-style:none}
.step{padding-block-start:22px;border-top:3px solid var(--navy)}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--orange);color:var(--on-orange);font-weight:700}
.step h3{margin-top:16px;font-size:18.5px;font-weight:700}
.step p{margin-top:8px;font-size:14.8px;color:var(--ink-soft)}

/* CTA */
.cta{padding-bottom:clamp(64px,8vw,104px)}
.cta-box{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding:clamp(30px,5vw,54px);border-radius:22px;background:var(--navy-deep);color:var(--on-dark)}
.cta-box>div{flex:1 1 320px;min-width:0}
.cta-box h2{font-size:clamp(26px,3vw,38px);font-weight:700;max-width:20ch}
.cta-box p{margin-top:10px;color:var(--on-dark-soft);max-width:46ch}

/* Footer */
.footer{background:var(--navy-deep);color:var(--on-dark-soft);font-size:14.5px}
.footer-in{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:32px;padding-block:56px 36px}
.footer-logo{display:inline-block;padding:10px 14px;background:var(--bg);border-radius:12px}
.footer-logo img{height:44px;width:auto}
.footer h3{font-size:14px;color:var(--on-dark);margin-bottom:12px;font-weight:700;letter-spacing:0}
.footer ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.footer a:hover{color:var(--on-dark)}
.footer .tag{margin-top:14px;max-width:34ch}
.copyright{padding-block:18px;border-top:1px solid var(--on-dark-line);font-size:13px}

/* WhatsApp */
.wa{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline-end:22px;z-index:40;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#25D366;box-shadow:0 12px 26px -6px rgba(0,0,0,.4);transition:transform .15s}
.wa:hover{transform:scale(1.07)}
.wa svg{width:32px;height:32px;fill:#fff}

@media (max-width:1040px){
  .nav{display:none}
  .menu-toggle{display:inline-flex}
  .nav.open{display:flex;position:absolute;top:100%;inset-inline:0;flex-direction:column;gap:2px;padding:12px 24px 18px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .nav.open a{padding:10px 0;border:0}
  .hero{display:flex;flex-direction:column}
  .hero-in{padding-block:44px 32px}
  .hero-copy{max-width:640px}
  .hero-media{position:relative;inset:auto;aspect-ratio:16/10}
  .hero-media::after{display:none}
  .hero-media img{object-position:78% center}
  .chip-1{top:6%;inset-inline-start:3%}
  .chip-2{bottom:6%;inset-inline-start:3%}
  .strip-in{grid-template-columns:repeat(2,1fr)}
  .strip-item,.strip-item:first-child{padding-inline-start:22px}
  .strip-item:nth-child(odd){border-inline-start:0;padding-inline-start:0}
  .strip-item:nth-child(n+3){border-top:1px solid var(--on-dark-line)}
  .grid,.steps{grid-template-columns:repeat(2,1fr)}
  .roles-grid{grid-template-columns:repeat(3,1fr)}
  .footer-in{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  :root{--gutter:16px}
  .header-in{height:64px;gap:8px}
  .brand img{height:38px}
  .nav.open{padding-inline:16px}
  .signin,.header-demo{display:none}
  .nav.open .nav-signin{display:block}
  .lang-btn{padding:0 9px}
  .grid,.steps{grid-template-columns:1fr}
  .roles-grid{grid-template-columns:repeat(2,1fr)}
  .role:last-child{grid-column:1/-1}
  .hero-cta .btn{flex:1 1 100%}
  .hero-media{aspect-ratio:4/3}
  .chip-card{padding:7px 10px;gap:7px;border-radius:11px}
  .chip-card b{font-size:12px}
  .chip-card span.sub{font-size:10.5px}
  .chip-ico{width:26px;height:26px;border-radius:8px}
  .chip-ico svg{width:14px;height:14px}
  .strip-item{padding:18px 14px}
  .footer-in{gap:26px}
  .footer-brand,.footer-talk{grid-column:1/-1}
  .cta-box .btn{width:100%}
  .wa{width:54px;height:54px;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

</svg>

<header class="header">
  <div class="wrap header-in">
    <a class="brand" href="#top"><img src="assets/logo.png" width="596" height="200" alt="Lesson Lab"></a>
    <nav class="nav" id="nav" aria-label="Main">
      <a class="on" href="#top" data-t="nav.home"></a>
      <a href="#features" data-t="nav.features"></a>
      <a href="#how" data-t="nav.how"></a>
      <a href="#contact" data-t="nav.contact"></a>
      <a class="nav-signin" href="#top" data-t="nav.signIn"></a>
    </nav>
    <div class="header-actions">
      <div class="lang">
        <button class="lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" data-t-label="lang.label">
          <svg aria-hidden="true"><use href="#i-lang"/></svg>
          <span id="langCurrent"></span>
          <svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>
        </button>
        <ul class="lang-menu" id="langMenu" role="menu" hidden>
          <li role="none"><button type="button" role="menuitemradio" data-lang="en" aria-checked="true" lang="en">English <svg class="tick" width="16" height="16" aria-hidden="true"><use href="#check"/></svg></button></li>
          <li role="none"><button type="button" role="menuitemradio" data-lang="ar" aria-checked="false" lang="ar">العربية <svg class="tick" width="16" height="16" aria-hidden="true"><use href="#check"/></svg></button></li>
        </ul>
      </div>
      <a class="signin" href="#top" data-t="nav.signIn"></a>
      <a class="btn btn-primary btn-sm header-demo" href="#contact" data-t="nav.cta"></a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-copy">
        <span class="eyebrow"><i></i><span data-t="hero.eyebrow"></span></span>
        <h1><span data-t="hero.title1"></span> <em data-t="hero.title2"></em></h1>
        <p class="lede" data-t="hero.lede"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#contact" data-t="hero.primary"></a>
          <a class="btn btn-outline" href="#features" data-t="hero.secondary"></a>
        </div>
        <ul class="facts">
          <li><svg aria-hidden="true"><use href="#check"/></svg><span data-t="hero.fact1"></span></li>
          <li><svg aria-hidden="true"><use href="#check"/></svg><span data-t="hero.fact2"></span></li>
          <li><svg aria-hidden="true"><use href="#check"/></svg><span data-t="hero.fact3"></span></li>
        </ul>
      </div>

    <div class="hero-media">
      <img src="assets/hero.jpg" width="1800" height="1005" alt="" data-t-alt="hero.alt">

        <span class="chip-ico t-navy"><svg><use href="#i-att"/></svg></span>
        <div><b data-t="hero.chip1a"></b><span class="sub" data-t="hero.chip1b"></span></div>

const LANG_KEY = "lessonlab-lang";
const langBtn = document.getElementById("langBtn"), langMenu = document.getElementById("langMenu");
const nav = document.getElementById("nav"), toggle = document.getElementById("menuToggle");
let currentLang = "en";
function readSavedLang(){ try { return localStorage.getItem(LANG_KEY); } catch { return null; } }
function saveLang(lang){ try { localStorage.setItem(LANG_KEY, lang); } catch {} }
function syncToggleLabel(){
  const open = nav.classList.contains("open");
  toggle.setAttribute("aria-expanded", String(open));
  toggle.setAttribute("aria-label", T[currentLang][open ? "nav.close" : "nav.menu"]);
}
function closeMenu(returnFocus){
  if (langMenu.hidden) return;
  langMenu.hidden = true;
  langBtn.setAttribute("aria-expanded","false");
  if (returnFocus) langBtn.focus();
}
function setLang(lang){
  currentLang = lang;
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = d[el.dataset.t]; });
  document.querySelectorAll("[data-t-label]").forEach(el => el.setAttribute("aria-label", d[el.dataset.tLabel]));
  document.querySelectorAll("[data-t-alt]").forEach(el => { el.alt = d[el.dataset.tAlt]; });
  document.getElementById("langCurrent").textContent = d["lang.name"];
  langMenu.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.lang === lang)));
  syncToggleLabel();
}
langBtn.addEventListener("click", e => {
  e.stopPropagation();
  const open = langMenu.hidden;
  langMenu.hidden = !open;
  langBtn.setAttribute("aria-expanded", String(open));
  if (open) langMenu.querySelector('[aria-checked="true"]').focus();
});
langMenu.addEventListener("click", e => {
  e.stopPropagation();
  const b = e.target.closest("[data-lang]");
  if (b) { setLang(b.dataset.lang); saveLang(b.dataset.lang); closeMenu(true); }
});
langMenu.addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...langMenu.querySelectorAll("[data-lang]")];
  const step = e.key === "ArrowDown" ? 1 : -1;
  items[(items.indexOf(document.activeElement) + step + items.length) % items.length].focus();
});
document.addEventListener("click", () => closeMenu(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(true); });
toggle.addEventListener("click", () => { nav.classList.toggle("open"); syncToggleLabel(); });
nav.addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); syncToggleLabel(); } });
const urlLang = new URLSearchParams(location.search).get("lang");
const startLang = urlLang || readSavedLang();
setLang(startLang === "ar" ? "ar" : "en");
