name: Deploy staging

# Runs after CI finishes on main. Deploys only if CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time; a newer merge waits for the running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BACKEND: ghcr.io/ehtisham145/lessonlab-backend
      FRONTEND: ghcr.io/ehtisham145/lessonlab-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build the images
        run: |
          docker build --build-arg APP_VERSION="$SHA" -t "$BACKEND:$SHA" backend
          docker build --build-arg APP_VERSION="$SHA" -t "$FRONTEND:$SHA" frontend
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND }}:${{ env.SHA }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND }}:${{ env.SHA }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1
      - name: Push to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$BACKEND:$SHA"
          docker push "$FRONTEND:$SHA"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lessonlab.me
    permissions:
      packages: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy on the server
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The server runs only deploy.sh for this key. It reads the commit
        # from the command and a short-lived registry token from stdin.
        run: echo "$TOKEN" | ssh -i ~/.ssh/deploy "deploy@$HOST" "$SHA"
      - name: Check the live site
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://staging.lessonlab.me/api/health/
