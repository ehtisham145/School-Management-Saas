name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school_saas
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: school_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://school_saas:ci_only_password@localhost:5432/school_saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  backend-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: lessonlab-backend:ci
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE" backend
      - name: Show the image size
        run: docker images "$IMAGE"
      - name: Runs as the non-root user
        run: test "$(docker run --rm "$IMAGE" id -u)" = "10001"
      - name: Has no test folders
        run: test -z "$(docker run --rm "$IMAGE" find /app -type d -name tests)"
      - name: Code is read-only
        run: |
          if docker run --rm "$IMAGE" touch /app/x; then
            echo "The app user can write to /app"
            exit 1
          fi
      - name: Media is writable
        run: docker run --rm "$IMAGE" touch /app/media/x
      - name: Has no pip
        run: |
          if docker run --rm "$IMAGE" python -m pip --version; then
            echo "pip is still in the image"
            exit 1
          fi
      - name: App loads without pip and setuptools
        run: >-
          docker run --rm
          -e SECRET_KEY=ci-only
          -e DATABASE_URL=postgres://ci:ci@localhost/ci
          -e REDIS_URL=redis://localhost:6379/0
          -e EMAIL_HOST=ci
          -e CSRF_TRUSTED_ORIGINS=https://ci.invalid
          "$IMAGE"
          sh -c "python manage.py check && python -c 'import config.asgi, uvicorn_worker, config.celery'"


  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lessonlab-frontend:ci frontend
      - run: docker run -d -p 3000:3000 lessonlab-frontend:ci
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/en/login
      - if: failure()
        run: docker logs frontend
