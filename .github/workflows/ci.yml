name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school_saas
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: school_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://school_saas:ci_only_password@localhost:5432/school_saas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit the Python packages
        run: |
          pip install "pip-audit>=2.9,<3"
          pip-audit -r backend/requirements/prod.txt
      - name: Audit the npm packages
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan the code for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          version: v0.76.1

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.5.0
        if: always()
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  backend-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: lessonlab-backend:ci
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE" backend
      - name: Show the image size
        run: docker images "$IMAGE"
      - name: Runs as the non-root user
        run: test "$(docker run --rm "$IMAGE" id -u)" = "10001"
      - name: Has no test folders
        run: test -z "$(docker run --rm "$IMAGE" find /app -type d -name tests)"
      - name: Code is read-only
        run: |
          if docker run --rm "$IMAGE" touch /app/x; then
            echo "The app user can write to /app"
            exit 1
          fi
      - name: Media is writable
        run: docker run --rm "$IMAGE" touch /app/media/x
      - name: Has no pip
        run: |
          if docker run --rm "$IMAGE" python -m pip --version; then
            echo "pip is still in the image"
            exit 1
          fi
      - name: App loads without pip and setuptools
        run: >-
          docker run --rm
          -e SECRET_KEY=ci-only
          -e DATABASE_URL=postgres://ci:ci@localhost/ci
          -e REDIS_URL=redis://localhost:6379/0
          -e EMAIL_HOST=ci
          -e CSRF_TRUSTED_ORIGINS=https://ci.invalid
          "$IMAGE"
          sh -c "python manage.py check && python -c 'import config.asgi, uvicorn_worker, config.celery'"
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1

  frontend-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: lessonlab-frontend:ci
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE" frontend
      - name: Show the image size
        run: docker images "$IMAGE"
      - name: Runs as the non-root user
        run: test "$(docker run --rm "$IMAGE" id -u)" = "10001"
      - name: Has no source code or source maps
        run: |
          docker run --rm "$IMAGE" test ! -e /app/src
          test -z "$(docker run --rm "$IMAGE" find /app -name '*.map')"
      - name: Code is read-only
        run: |
          if docker run --rm "$IMAGE" touch /app/x; then
            echo "The app user can write to /app"
            exit 1
          fi
      - name: Has no npm
        run: |
          if docker run --rm "$IMAGE" sh -c "command -v npm"; then
            echo "npm is still in the image"
            exit 1
          fi
      - name: Start with the runtime hardening
        run: >-
          docker run -d --name frontend -p 3000:3000
          --read-only
          --tmpfs /tmp
          --tmpfs /app/.next/cache:uid=10001,gid=10001
          --cap-drop ALL
          --security-opt no-new-privileges
          --health-interval 2s
          "$IMAGE"
      - name: Serves a page
        run: curl --fail --silent --output /dev/null --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/en/login
      - name: Optimizes an image
        run: curl --fail --silent --output /dev/null "http://localhost:3000/_next/image?url=%2Fbrand%2Flogo.png&w=640&q=75"
      - name: Becomes healthy
        run: |
          for attempt in $(seq 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' frontend)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Last health status: $status"
          exit 1
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1
      - if: failure()
        run: docker logs frontend

  staging-stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staging
    env:
      BACKEND_IMAGE: lessonlab-backend:ci
      FRONTEND_IMAGE: lessonlab-frontend:ci
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$BACKEND_IMAGE" ../backend
      - run: docker build -t "$FRONTEND_IMAGE" ../frontend
      - name: Create the settings from the example
        run: |
          cp .env.example .env
          for name in SECRET_KEY POSTGRES_PASSWORD REDIS_PASSWORD; do
            sed -i "s/^$name=.*/$name=$(openssl rand -hex 32)/" .env
          done
      - run: docker network create lessonlab-edge
      - name: Run the migrations
        run: docker compose run --rm lessonlab-migrate
      - name: Start every service and wait until healthy
        run: docker compose up -d --wait --wait-timeout 180
      - name: Serves the admin stylesheet
        run: |
          docker compose exec -T lessonlab-backend python -c "
          import re, urllib.request as u
          headers = {'Host': 'staging.example.com', 'X-Forwarded-Proto': 'https'}
          def get(path):
              return u.urlopen(u.Request('http://127.0.0.1:8000' + path, headers=headers), timeout=10)
          page = get('/admin/login/').read().decode()
          path = re.search(r'/static/admin/css/base[^\"]*\.css', page).group()
          response = get(path)
          assert response.headers['Content-Type'].startswith('text/css'), response.headers['Content-Type']
          print(path)
          "
      - name: Publishes no ports
        run: test -z "$(docker compose ps --format '{{.Ports}}' | grep -e '->' || true)"
      - if: failure()
        run: docker compose logs --no-color
