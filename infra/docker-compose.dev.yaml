name: school-saas-dev

services:
  postgres:
    image: postgres:17
    envrioment:
      POSTGRES_DB: school_saas
      POSTGRES_USER: school_saas
      POSTGRES_PASSWORD: devpass123

    ports:
      - "5432:5432"

    volumes:
      - "pgdata:/var/lib/postgresql/data"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_saas"]
      interval: 5s
      retries: 5

    redis:
      image: redis:7
      ports:
        - "6379:6379"

volumes:
  pgdata:
